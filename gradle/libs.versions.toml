[versions]
agp = "9.2.1"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.12.4"
kotlin = "2.2.10"
composeBom = "2026.06.01"
googleServices = "4.4.4"
# Gradle-плагин Crashlytics: он же загружает mapping.txt после R8. Идёт своей
# линией версий, не связанной с версией SDK ниже.
firebaseCrashlyticsGradle = "3.0.8"
appcompat = "1.7.1"
lifecycleViewmodelCompose = "2.10.0"
# Retrofit 2.11+ приносит собственные consumer-правила ProGuard (retrofit2.pro),
# поэтому рукописные -if interface для R8 full mode в proguard-rules.pro больше
# не нужны. На 3.0.0 не идём: там мажор с удалениями API.
retrofit = "2.12.0"
retrofitKotlinxSerializationConverter = "1.0.0"
# Остаёмся на 4.x: 5.x — мажор с изменённым Kotlin API.
okhttp = "4.12.0"
# С 1.6 артефакт тоже несёт свои consumer-правила для сериализаторов.
kotlinxSerializationJson = "1.9.0"
securityCrypto = "1.1.0-alpha06"
coil = "2.7.0"
# SDK Crashlytics подключён только к beta/betaRelease (см. app/build.gradle.kts):
# в debug краши видно в logcat, а release тестерам не раздаётся.
firebaseCrashlyticsSdk = "20.1.1"
# KSP обязан быть версия-в-версию с kotlin: префикс версии — это и есть версия
# компилятора, под которую собран процессор. Рассинхрон валит сборку сразу.
ksp = "2.2.10-2.0.2"
room = "2.8.5"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Иконки Material больше не приходят транзитивно с material3; артефакт заморожен на 1.7.8 и пинится тем же BOM.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleViewmodelCompose" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization-converter = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxSerializationConverter" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# Тот же version.ref, что и у okhttp: логгер обязан идти версия-в-версию с ядром.
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics", version.ref = "firebaseCrashlyticsSdk" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
# С 2.7 поддержка корутин переехала в room-runtime, но артефакт всё ещё несёт
# расширения вроде withTransaction — держим, пока он не удалён окончательно.
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsGradle" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

